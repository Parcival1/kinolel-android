# KinoLel-App (Android) – Marke. EINZIGE Stelle für Name, Server, Kennung und Version.
# Name endgültig „KinoLel“ (Lel, 15.10.2026). APPLICATION_ID nie ändern (sonst neue App statt Update).
APP_NAME=KinoLel
SERVER_URL=https://kinolel.de
APPLICATION_ID=de.kinolel.app
# Version (drei Zahlen). Bei jeder Verteilung erhöhen; Tag v<Version> erzeugt eine Testversion unter Releases.
VERSION=0.1.6
# Auto-Update: GitHub-Repo, dessen Releases die App beim Start prüft (APK)
UPDATE_REPO=Parcival1/kinolel-android
# Downloads in der App: true = Knopf nur für Konten mit Jellyfin-Recht „Herunterladen“, false = für alle Konten.
# Lel 20.10.2026: Recht für ALLE (auch Browser), daher true – die App folgt dem Recht, falls es einem Konto entzogen wird.
DOWNLOADS_NUR_MIT_RECHT=true
