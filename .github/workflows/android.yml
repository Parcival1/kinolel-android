# KinoLel-App (Android): Build (abgeleitet von jellyfin-android app-build/app-publish)
#
# Bei jedem Push auf main und von Hand: signierte Test-APK als Artefakt + Rauchtest im Emulator (Bildschirmfoto).
# Tag "v*" (z. B. v0.1.0): zusätzlich Vorab-Version unter "Releases" mit direktem Download-Link.
name: android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .tools-versions

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Version
        run: |
          VERSION=$(grep '^VERSION=' marke.properties | cut -d= -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF#refs/tags/v}; fi
          echo "JELLYFIN_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      - name: Signierschlüssel
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 fehlt"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kinolel-release.p12"

      - name: Assemble release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/kinolel-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: kinolel # nicht geheim (als Secret würde GitHub das Wort in allen Logs schwärzen)
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleProprietaryRelease

      - name: Unit-Tests (u. a. lesbare Dialoge)
        run: ./gradlew testProprietaryDebugUnitTest

      - name: APK umbenennen + Signatur prüfen
        run: |
          mkdir -p build/kinolel
          APK=$(find app/build/outputs/apk/proprietary/release -name "*.apk" | head -1)
          cp "$APK" "build/kinolel/KinoLel-$JELLYFIN_VERSION.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # Exit-Code 0 = Signatur gültig; Zertifikat anzeigen (SHA-256 muss zum Schlüssel auf CT 104 passen)
          "$BT/apksigner" verify --print-certs "build/kinolel/KinoLel-$JELLYFIN_VERSION.apk" > "$RUNNER_TEMP/signatur.txt"
          grep -i -E "certificate (DN|SHA-256)" "$RUNNER_TEMP/signatur.txt" || cat "$RUNNER_TEMP/signatur.txt"
          rm -f "$RUNNER_TEMP/kinolel-release.p12"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kinolel-android-apk
          path: build/kinolel/*.apk
          if-no-files-found: error

      - name: Vorab-Version als Entwurf anlegen (nur bei Tag v*; veröffentlicht erst nach grünem Test)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/kinolel/*.apk --draft --prerelease --title "Testversion $GITHUB_REF_NAME (Android)" --notes-file TESTANLEITUNG.md

  rauchtest:
    name: Rauchtest im Emulator
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: APK holen
        uses: actions/download-artifact@v8
        with:
          name: kinolel-android-apk
          path: apk

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Python-Werkzeug für die WebView-Steuerung (App-Link-Test)
        run: pip3 install --quiet websocket-client

      - name: Emulator starten, App öffnen, Bildschirmfotos, App-Link vom Fernseher-QR-Code
        env:
          # Vorversion über die GitHub-API finden (ohne Anmeldung oft gesperrt: 60 Anfragen/Std. je Runner-Adresse)
          GH_TOKEN: ${{ github.token }}
          # App-Link-Test meldet sich einmal mit dem Hilfskonto an (ohne Secret nur bis zur Anmeldeseite)
          KINOLEL_TEST_PW: ${{ secrets.KINOLEL_TEST_PW }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: |
            bash .github/scripts/rauchtest.sh
            python3 .github/scripts/applink_test.py rauchtest/applink

      - name: Bildschirmfotos hochladen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rauchtest-bilder
          path: rauchtest/

      - name: Ergebnis prüfen
        run: |
          cat rauchtest/sprache.txt rauchtest/neuigkeiten.txt 2>/dev/null || true
          if grep -hE "FEHLT|FEHLER|NICHT ungarisch|nicht geprüft" rauchtest/sprache.txt rauchtest/neuigkeiten.txt; then echo "::error::Rauchtest mit Fehlern"; exit 1; fi
          python3 -c "import json,sys; e=json.load(open('rauchtest/applink/ergebnis.json')); f=[k for k,v in e.items() if not (v.get('ok') if isinstance(v,dict) else v)]; print('App-Link-Fehler:', f) if f else print('App-Link alles OK'); sys.exit(1 if f else 0)"

  # KinoLel (Lel 20.10.2026): Downloads wie bei Netflix – Herunterladen, Flugmodus, offline abspielen, Position nachmelden.
  # Läuft nur mit dem Secret KINOLEL_TEST_PW (Passwort des Hilfskontos, setzt Lel); sonst übersprungen.
  # Nur bei Versionen oder mit „[download-test]“ in der Commit-Nachricht (lädt Titel herunter – schont Server und NAS).
  # Prüft auch Befehle vom Server an den nativen Player (Play, Pause, Weiter, Spulen, Stopp).
  downloadtest:
    name: Download-Test im Emulator (offline)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[download-test]')
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: APK holen
        uses: actions/download-artifact@v8
        with:
          name: kinolel-android-apk
          path: apk

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Python-Werkzeug für die WebView-Steuerung
        run: pip3 install --quiet websocket-client

      - name: Emulator starten, Download-Test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KINOLEL_TEST_PW: ${{ secrets.KINOLEL_TEST_PW }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            python3 .github/scripts/download_test.py downloadtest

      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: downloadtest
          path: downloadtest/
          retention-days: 3
          if-no-files-found: ignore

      - name: Ergebnis prüfen
        run: |
          python3 -c "import json,sys; e=json.load(open('downloadtest/ergebnis.json')); f=[x for x in e.get('schritte',[]) if not x.get('ok')]; print('Fehler:', f) if f else print('alles OK'); sys.exit(1 if f else 0)"

  veroeffentlichen:
    # Lel 25.10.: erst nach grünem Test sichtbar (Entwurf -> veröffentlicht); apps.json übernimmt nur veröffentlichte
    name: Release veröffentlichen (nur bei Tag v*, nach grünem Test)
    needs: [build, rauchtest, downloadtest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - name: Entwurf veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
